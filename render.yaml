services:
  - type: web
    name: wellness-tool-llm-v3
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: DEMO_FALLBACK
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
