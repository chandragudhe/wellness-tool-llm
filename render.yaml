services:
  - type: web
    name: wellness-tool-free-llm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: DEMO_FALLBACK
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
